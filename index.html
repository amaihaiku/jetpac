<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <!-- Gyártói meta tagek: Notch, Dynamic Island és Safe Area kezeléshez -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>Jetpac 1983 - Mobile Arcade Edition</title>

  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* Modern mobil böngésző dinamikus nézőtér */
      background: #000;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: monospace;
    }

    /* Fő elrendezés safe-area margókkal */
    #app-container {
      display: flex;
      width: 100%;
      height: 100%;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      /* Apple és Android kamera / home bar védett zónák */
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 12px);
      padding-right: env(safe-area-inset-right, 12px);
      background: #040406;
    }

    /* Játéktér középen: mindig megtartja a 4:3-as arányt */
    #game-frame {
      position: relative;
      aspect-ratio: 256 / 192;
      height: 96%;
      max-width: calc(96vh * (256 / 192));
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #1a1a24;
      background: #000;
      box-shadow: 0 0 30px rgba(0, 216, 216, 0.15);
    }

    canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }

    /* Bal és Jobb oldali vezérlő sávok */
    .control-zone {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 50;
    }

    /* Joystick stílusa (Bal oldal) */
    #joystick-base {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(0, 216, 216, 0.35);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 15px rgba(0, 216, 216, 0.1);
    }

    #joystick-knob {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle, #00ffff 0%, #008888 100%);
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.6);
      position: absolute;
      top: 31px;
      left: 31px;
      pointer-events: none;
      transform: translate(0px, 0px);
      transition: transform 0.04s ease-out;
    }

    /* Tűzgomb (Jobb oldal) */
    #fire-button {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, #ff2255 0%, #880022 100%);
      border: 3px solid #ff4477;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(255, 34, 85, 0.4);
      cursor: pointer;
    }

    #fire-button:active, #fire-button.active {
      transform: scale(0.92);
      box-shadow: 0 0 30px rgba(255, 34, 85, 0.8);
      background: radial-gradient(circle, #ff4477 0%, #aa0033 100%);
    }

    /* ÁLLÓ HELYZET LETILTÁSA (Overlay) */
    #orientation-blocker {
      display: none;
      position: fixed;
      inset: 0;
      background: #050508;
      z-index: 99999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      color: #00ffff;
    }

    #orientation-blocker svg {
      width: 70px;
      height: 70px;
      fill: #00ffff;
      margin-bottom: 20px;
      animation: rotate-phone 2s infinite ease-in-out;
    }

    @keyframes rotate-phone {
      0%, 20% { transform: rotate(0deg); }
      50%, 70% { transform: rotate(-90deg); }
      100% { transform: rotate(0deg); }
    }

    /* Csak álló tájolás esetén aktiválódik */
    @media screen and (orientation: portrait) {
      #orientation-blocker {
        display: flex !important;
      }
    }
  </style>
</head>
<body>

  <!-- Álló nézet figyelmeztető képernyő -->
  <div id="orientation-blocker">
    <svg viewBox="0 0 24 24">
      <path d="M16 1H8C6.34 1 5 2.34 5 4v16c0 1.66 1.34 3 3 3h8c1.66 0 3-1.34 3-3V4c0-1.66-1.34-3-3-3zm1 18H7V5h10v14z"/>
    </svg>
    <h2 style="margin-bottom: 8px; color: #ffff00;">FORDÍTSD EL A KÉSZÜLÉKET!</h2>
    <p style="color: #ffffff; font-size: 14px;">A játék kizárólag fekvő tájolásban működik.</p>
  </div>

  <!-- Reszponzív játék felület -->
  <div id="app-container">
    <!-- Bal oldal: Joystick zóna -->
    <div class="control-zone" id="joystick-zone">
      <div id="joystick-base">
        <div id="joystick-knob"></div>
      </div>
    </div>

    <!-- Közép: Játéktér -->
    <div id="game-frame">
      <canvas id="gameCanvas" width="256" height="192"></canvas>
    </div>

    <!-- Jobb oldal: Tűzgomb -->
    <div class="control-zone">
      <div id="fire-button">FIRE</div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
